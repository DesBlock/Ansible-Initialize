---
- name: Install Custom Aliases (Zsh)
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] ~ '/.zshrc' }}"
    block: |
      {% for item in aliases %}
      {{ item }}
      {% endfor %}
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Aliases"
  when: ansible_facts['env']['SHELL'] == "/bin/zsh"

- name: Install Custom Aliases (Bash)
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] ~ '/.bashrc' }}"
    block: |
      {% for item in aliases %}
      {{ item }}
      {% endfor %}
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Aliases"
  when: ansible_facts['env']['SHELL'] == "/bin/bash"
